name: globe_mint
description: "Personal Digital Savings Platform — Save smarter with stablecoin infrastructure."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  http: ^1.3.0

  # Persistence
  shared_preferences: ^2.2.2

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.19.0
  gap: ^3.0.1

  # Fonts
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.2

  # Icons
  lucide_icons: ^0.257.0
  qr_flutter: ^4.1.0

  # WalletConnect v2 (dapp role): lets the recovery/withdraw flow sign the same
  # EIP-712 payloads over a WalletConnect session instead of only the injected
  # browser wallet. We use reown_sign (the Sign client) rather than
  # reown_walletkit: WalletKit implements the WALLET side (approving proposals,
  # answering requests) while a dapp that initiates sessions and sends
  # eth_signTypedData_v4 is the Sign client role.
  reown_sign: ^1.2.0
  url_launcher: ^6.3.2
  reown_core: ^1.2.0
  flutter_secure_storage: ^10.3.4
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.8
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/announcements.json
