global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: globmint-server
    static_configs:
      - targets: ["server:8081"]
    metrics_path: /metrics
    # The server is behind the same Caddy proxy in prod; scrape directly for
    # reliability: add "server:8081" (compose network DNAT from /metrics).
  - job_name: globmint-server-via-caddy
    static_configs:
      - targets: ["caddy:80"]
    metrics_path: /metrics
    honor_labels: true