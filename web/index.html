<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Globmint — Personal Digital Savings Platform.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Globmint">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Globmint</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000000;
    }

    #flt-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      z-index: 99999;
      transition: opacity 0.4s ease;
    }

    #flt-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #flt-splash-logo {
      width: 84px;
      height: 84px;
      animation: splash-pulse 1.6s ease-in-out infinite;
    }

    #flt-splash-wordmark {
      position: absolute;
      bottom: 64px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #FFFFFF;
    }

    #flt-splash-attribution {
      position: absolute;
      bottom: 36px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.2px;
      color: rgba(255, 255, 255, 0.55);
    }

    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <!-- Branded loading splash shown while Flutter initializes -->
  <div id="flt-splash">
    <img id="flt-splash-logo" src="/assets/assets/images/logo.png" alt="Globe Mint">
    <span id="flt-splash-wordmark">Globmint</span>
    <span id="flt-splash-attribution">Made by divine.build</span>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('flt-splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function () { splash.remove(); }, 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
